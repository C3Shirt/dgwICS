[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factoryio-agents"
version = "0.1.0"
description = "Four-role Factory I/O and CODESYS simulation workflow"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]

[project.scripts]
factoryio-agents = "factoryio_agents.__main__:main"
factoryio-agent = "factoryio_agents.cli:main"
factoryio-dashboard = "factoryio_agents.web_dashboard:main"

[tool.setuptools.packages.find]
include = ["factoryio_agents*"]

[tool.setuptools.package-data]
factoryio_agents = ["prompts/*.md", "knowledge/*.json", "webui/*.html", "webui/*.css", "webui/*.js"]
